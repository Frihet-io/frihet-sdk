name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck

      # The resolver that decides WHICH release publish-drift.yml re-proves. Pure Node,
      # no dependencies, so it runs with the repo toolchain rather than a package suite.
      - name: Release-pin resolver suite
        if: matrix.node != 18
        run: pnpm test:scripts

      # vitest 4 requires Node 20+, so the full suite runs on 20/22 and the
      # built bundle is smoke-tested on the oldest supported Node instead.
      - name: SDK test suite
        if: matrix.node != 18
        run: pnpm --filter @frihet/sdk test

      # Agent-facing CLI contract: the machine-readable credential failure, the
      # settings URL that actually issues a key, and the guarantee that AGENTS.md
      # only names SDK methods that exist.
      - name: CLI agent-contract suite
        if: matrix.node != 18
        run: pnpm --filter frihet test

      - name: Node 18 runtime smoke (built bundle)
        if: matrix.node == 18
        run: node packages/sdk/scripts/smoke-dist.mjs
